<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#1f2937">
  <defs>
    <marker id="pfeil" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1,1 L10,6 L1,11" fill="none" stroke="#374151" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="780" height="400" fill="#ffffff"/>

  <!-- Kontext -->
  <rect x="30" y="40" width="250" height="110" fill="#eef4ff" stroke="#374151" stroke-width="1.5"/>
  <line x1="30" y1="72" x2="280" y2="72" stroke="#374151"/>
  <line x1="30" y1="102" x2="280" y2="102" stroke="#374151"/>
  <text x="155" y="62" text-anchor="middle" font-weight="bold" font-size="14">Order</text>
  <text x="42" y="92">- weightKg: double</text>
  <text x="42" y="122">+ setShippingStrategy(strategy)</text>
  <text x="42" y="142">+ shippingCost(): double</text>

  <!-- Strategie-Interface -->
  <rect x="440" y="40" width="300" height="90" fill="#fff7e0" stroke="#374151" stroke-width="1.5"/>
  <line x1="440" y1="88" x2="740" y2="88" stroke="#374151"/>
  <text x="590" y="60" text-anchor="middle" font-style="italic">«interface»</text>
  <text x="590" y="79" text-anchor="middle" font-weight="bold" font-size="14">ShippingStrategy</text>
  <text x="452" y="113">+ calculateCost(weightKg): double</text>

  <!-- Order nutzt die Strategie -->
  <line x1="280" y1="85" x2="440" y2="85" stroke="#374151" stroke-width="1.5" marker-end="url(#pfeil)"/>
  <text x="360" y="77" text-anchor="middle" font-size="12">shippingStrategy</text>

  <!-- Konkrete Strategien implementieren das Interface -->
  <path d="M590,130 L578,144 L602,144 Z" fill="#ffffff" stroke="#374151" stroke-width="1.5"/>
  <path d="M590,144 L590,210 M135,210 L645,210 M135,210 L135,270 M390,210 L390,270 M645,210 L645,270" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="6 4"/>

  <rect x="30" y="270" width="210" height="70" fill="#eaf7ee" stroke="#374151" stroke-width="1.5"/>
  <line x1="30" y1="302" x2="240" y2="302" stroke="#374151"/>
  <text x="135" y="292" text-anchor="middle" font-weight="bold" font-size="14">StandardShipping</text>
  <text x="135" y="326" text-anchor="middle">4,90 + 0,50 × kg</text>

  <rect x="285" y="270" width="210" height="70" fill="#eaf7ee" stroke="#374151" stroke-width="1.5"/>
  <line x1="285" y1="302" x2="495" y2="302" stroke="#374151"/>
  <text x="390" y="292" text-anchor="middle" font-weight="bold" font-size="14">ExpressShipping</text>
  <text x="390" y="326" text-anchor="middle">9,90 + 1,00 × kg</text>

  <rect x="540" y="270" width="210" height="70" fill="#eaf7ee" stroke="#374151" stroke-width="1.5"/>
  <line x1="540" y1="302" x2="750" y2="302" stroke="#374151"/>
  <text x="645" y="292" text-anchor="middle" font-weight="bold" font-size="14">PickupShipping</text>
  <text x="645" y="326" text-anchor="middle">0,00</text>

  <text x="30" y="380" font-size="12" fill="#6b7280">Order kennt nur das Interface – die Versandart ist zur Laufzeit austauschbar.</text>
</svg>
